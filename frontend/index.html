<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>segfault-goes-brrr</title>
    <link rel="stylesheet" href="/css/main.css" />
    <link rel="stylesheet" href="/css/polish.css?v=2" />
    <script type="module" src="/js/main.js"></script>
    <script type="module" src="/js/bets.js"></script>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <h1>Мемкоїни</h1>
        <a class="btn" href="/tradeline.html">Tradeline</a>
        <a class="btn" href="/leaderboard/">🏆 Лідерборд</a>
        <div id="account" class="account" aria-live="polite"></div>
      </header>

      <form id="filters" class="filters">
        <label>
          Монета
          <select name="coin">
            <optgroup label="Топ-монети">
              <option value="bitcoin">Bitcoin (BTC)</option>
              <option value="ethereum">Ethereum (ETH)</option>
              <option value="solana">Solana (SOL)</option>
              <option value="binancecoin">BNB (BNB)</option>
              <option value="ripple">XRP (XRP)</option>
            </optgroup>
            <optgroup label="Мемкоїни">
            <option value="dogecoin">Dogecoin (DOGE)</option>
            <option value="shiba-inu">Shiba Inu (SHIB)</option>
            <option value="pepe">Pepe (PEPE)</option>
            <option value="dogwifcoin">dogwifhat (WIF)</option>
            <option value="bonk">Bonk (BONK)</option>
            <option value="floki">Floki (FLOKI)</option>
            </optgroup>
          </select>
        </label>
        <fieldset class="ranges">
          <legend>Період</legend>
          <label><input type="radio" name="days" value="1" /> 24 год</label>
          <label><input type="radio" name="days" value="7" checked /> 7 днів</label>
          <label><input type="radio" name="days" value="30" /> 30 днів</label>
          <label><input type="radio" name="days" value="90" /> 90 днів</label>
          <label><input type="radio" name="days" value="365" /> Рік</label>
        </fieldset>
        <label>
          Валюта
          <select name="currency">
            <option value="usd">USD</option>
            <option value="eur">EUR</option>
            <option value="uah">UAH</option>
          </select>
        </label>
      </form>

      <section class="card chart-card">
        <div class="headline">
          <span id="price" class="price">—</span>
          <span id="change" class="change"></span>
        </div>
        <p id="chart-message" class="message" role="status" aria-live="polite">Завантаження…</p>
        <div id="chart" class="chart">
          <svg id="chart-svg" role="img" aria-labelledby="chart-title"><title id="chart-title">Графік ціни</title></svg>
          <div id="tooltip" class="tooltip" hidden></div>
        </div>
        <details>
          <summary>Таблиця даних</summary>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Час</th><th>Ціна</th></tr></thead>
              <tbody id="table-body"></tbody>
            </table>
          </div>
        </details>
      </section>

      <section class="card bet-card" id="bet-card" hidden>
        <h2>Ставка <span id="balance" class="balance"></span></h2>
        <button type="button" id="reset-balance">Скинути баланс до $1000</button>
        <form id="bet-form" class="bet-form">
          <label>Сума (USD, мін. $1)
            <input name="stake" type="number" min="1" step="0.01" value="10" required />
          </label>
          <label>Секунд
            <select name="seconds">
              <option value="10">10</option>
              <option value="30" selected>30</option>
              <option value="60">60</option>
              <option value="300">300</option>
            </select>
          </label>
          <button type="submit" name="direction" value="up" class="bet-up">▲ Ціна вгору</button>
          <button type="submit" name="direction" value="down" class="bet-down">▼ Ціна вниз</button>
        </form>
        <p id="bet-message" class="message" role="status" aria-live="polite"></p>
        <table>
          <thead><tr><th>Монета</th><th>Напрям</th><th>Сума</th><th>Результат</th></tr></thead>
          <tbody id="bets-body"></tbody>
        </table>
      </section>
    </main>
  </body>
</html>
