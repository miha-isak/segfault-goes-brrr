[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi[standard]"]

[dependency-groups]
dev = [
    "pytest",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
# B008: FastAPI's Depends(...) in argument defaults is the normal pattern.
ignore = ["B008"]
